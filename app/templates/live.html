{% extends "base.html" %}
{% block title %}Live view — Pi-NVR{% endblock %}
{% block page_title %}Live view{% endblock %}
{% block content %}
<div style="display:flex; align-items:center; gap:10px; margin-bottom:16px; flex-wrap:wrap;">
  <div class="section-title" style="margin:0;">View</div>
  <button class="btn" data-view="spotlight">Spotlight</button>
  <button class="btn" data-view="grid">All cameras</button>
  <div style="flex:1;"></div>
  <div style="font-size:0.85em; color:var(--text-dim); margin-right:2px;">Quality</div>
  <button class="btn" data-quality="low" title="480p, fastest, least CPU">Low</button>
  <button class="btn" data-quality="medium" title="640p">Medium</button>
  <button class="btn" data-quality="high" title="960p, more CPU">High</button>
  <button class="btn" data-quality="max" title="1280p, slowest, most CPU">Max</button>
  <button class="btn" id="fullscreenBtn">Fullscreen</button>
</div>

<!-- Spotlight: one large featured camera, with the rest as clickable
     thumbnails along the right edge and bottom edge (an "inverted L"
     framing the main view). Clicking a thumbnail makes it the featured
     camera. Thumbnails are periodically-refreshed snapshots, not live
     streams -- keeping many simultaneous live decodes off the table,
     which matters given how little headroom a Pi 3 has and how many
     budget cameras only tolerate one active connection at a time. -->
<div class="spotlight-layout" id="spotlightLayout" style="display:none;">
  <div class="spotlight-main" id="spotlightMain"></div>
  <div class="spotlight-side" id="spotlightSide"></div>
  <div class="spotlight-bottom" id="spotlightBottom"></div>
</div>

<!-- Lives outside spotlightMain deliberately -- that container's innerHTML
     gets replaced whenever the featured camera changes, which would tear
     down and re-create an <audio> element mid-stream. Kept here instead so
     JS can control one persistent element regardless of how often the
     featured tile re-renders. -->
<audio id="spotlightAudio" style="display:none;"></audio>

<!-- All cameras: every camera shown live, equally sized. Clicking any
     tile switches to Spotlight with that camera featured. -->
<div class="camera-grid" id="gridLayout"></div>
{% endblock %}
{% block scripts %}
<script src="/static/js/live.js?v={{ static_version }}"></script>
{% endblock %}
