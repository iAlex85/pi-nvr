# Pi-NVR default configuration.
# Installed to /etc/pi-nvr/config.yaml by install.sh; edit that copy, not this one.
# All values here can also be changed from Settings in the web UI, which
# rewrites this file in place (never hardcode values in Python).

server:
  host: "0.0.0.0"
  port: 8080
  https_enabled: false
  https_cert: ""
  https_key: ""
  session_secret_env: "PI_NVR_SESSION_SECRET"   # set by install.sh into systemd env file
  session_timeout_minutes: 60
  remember_me_days: 30

database:
  path: "database/pi-nvr.db"

storage:
  default_target: "local"
  targets:
    local:
      path: "recordings"
      type: "local"
  retention:
    max_age_days: 30
    max_usage_percent: 85
    min_free_percent: 10
    check_interval_minutes: 15

recording:
  # MKV, not MP4, despite MP4 being the more "normal" default elsewhere.
  # Many IP cameras (this includes budget/consumer hardware broadly, not
  # one specific brand) send audio as PCM A-law/mu-law, which MP4's muxer
  # flatly refuses to contain even via stream-copy -- ffmpeg fails to
  # write the file header at all, and Pi-NVR's auto-restart then retries
  # every few seconds forever, which on a single-RTSP-client camera also
  # starves any other consumer of that camera's one connection slot (live
  # view, motion detection). MKV accepts arbitrary codecs via stream-copy
  # with no such restriction, matching the "never transcode" design goal
  # far more reliably across real-world camera hardware. Change this to
  # "mp4" only if you've confirmed your specific camera's audio codec is
  # MP4-compatible (e.g. AAC).
  container: "mkv"
  segment_seconds: 600
  pre_record_seconds: 5
  post_record_seconds: 10
  overlay:
    timestamp: true
    camera_name: true

motion:
  enabled_default: false
  downscale_width: 320
  downscale_height: 180
  sample_fps: 5
  sensitivity: 25            # OpenCV threshold, 1-100 scaled internally
  min_object_area_percent: 0.5
  max_object_area_percent: 80
  cooldown_seconds: 10

notifications:
  browser_enabled: true
  email:
    enabled: false
    smtp_host: ""
    smtp_port: 587
    smtp_user: ""
    smtp_password_env: "PI_NVR_SMTP_PASSWORD"
    from_address: ""
    to_addresses: []

logging:
  level: "INFO"
  dir: "logs"
  max_bytes: 5000000
  backup_count: 5

system:
  timezone: "UTC"
  language: "en"

# AI-assisted detection features. Disabled by default and, as of this
# version, NOT YET IMPLEMENTED -- these toggles exist so the setting is
# saved and forward-compatible with a future update that adds real
# object/face/animal detection, without needing a config migration then.
# Object detection in particular needs a neural network inference engine
# running continuously per camera, which is genuinely too heavy for a
# Raspberry Pi 3 to do well; this is intended for more capable hardware
# (Pi 4/5 with a Coral/Hailo accelerator, or an x86 host). The Settings
# UI reflects this honestly rather than pretending the toggle does
# something today.
ai:
  object_detection_enabled: false
  people_detection_enabled: false
  animal_detection_enabled: false

plugins:
  enabled: []
